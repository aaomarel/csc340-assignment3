<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Life API - Marine Animals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🌊 Ocean Life API</h1>
        <p>Marine Animals Database Management</p>
    </header>

    <main>
        <!-- Search Section -->
        <section class="search-section">
            <h2>Search Marine Animals</h2>
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Search by name...">
                <button onclick="searchAnimals()">Search</button>
                <button onclick="loadAllAnimals()">Show All</button>
            </div>
        </section>

        <!-- Add/Edit Animal Form -->
        <section class="form-section">
            <h2 id="formTitle">Add New Marine Animal</h2>
            <form id="animalForm">
                <input type="hidden" id="animalId">
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="species">Species:</label>
                    <input type="text" id="species" required>
                </div>

                <div class="form-group">
                    <label for="habitat">Habitat:</label>
                    <input type="text" id="habitat" required>
                </div>

                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">Add Animal</button>
                    <button type="button" onclick="resetForm()" id="cancelBtn" style="display:none;">Cancel</button>
                </div>
            </form>
        </section>

        <!-- Animals List -->
        <section class="animals-section">
            <h2>Marine Animals List</h2>
            <div id="animalsContainer">
                <p class="loading">Loading animals...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Ocean Life API. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
